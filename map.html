<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: white;
            padding: 15px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        #status {
            margin-top: 8px;
            color: #555;
        }

        #map {
            width: 100%;
            height: 600px;
        }

    </style>
</head>

<body>

    <header>
        <h1>Restaurant Map</h1>

        <div id="status">
            Loading restaurants...
        </div>
    </header>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // =====================================================
        // SUPABASE SETTINGS
        // =====================================================

        const projectUrl =
            "https://vdxfzhzslinccdlshuin.supabase.co";

        const apiKey =
            "sb_publishable_BUBtfkXaq3_poHxgNGJIDQ_jF_F4pWM";


        // =====================================================
        // CREATE LEAFLET MAP
        // =====================================================

        const map = L.map("map").setView([0, 0], 2);


        // =====================================================
        // ADD OPENSTREETMAP TILES
        // =====================================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // =====================================================
        // GET RESTAURANTS FROM SUPABASE
        // =====================================================

        fetch(
            `${projectUrl}/rest/v1/restaurants?select=*`,
            {
                method: "GET",

                headers: {
                    apikey: apiKey
                }
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    `HTTP Error: ${response.status}`
                );

            }

            return response.json();

        })


        // =====================================================
        // PROCESS RESTAURANTS
        // =====================================================

        .then(restaurants => {

            console.log(
                "Restaurants returned from Supabase:",
                restaurants
            );


            // ---------------------------------------------
            // CHECK FOR EMPTY DATABASE RESULT
            // ---------------------------------------------

            if (restaurants.length === 0) {

                document.getElementById("status").innerText =
                    "No restaurants found.";

                return;

            }


            document.getElementById("status").innerText =
                `${restaurants.length} restaurant(s) loaded`;


            // ---------------------------------------------
            // GROUP ALL MARKERS
            // ---------------------------------------------

            const markerGroup = L.featureGroup();


            // ---------------------------------------------
            // LOOP THROUGH DATABASE RESULTS
            // ---------------------------------------------

            restaurants.forEach(function(restaurant) {


                // Get coordinates from Supabase

                const latitude =
                    parseFloat(restaurant.latitude);

                const longitude =
                    parseFloat(restaurant.longitude);


                console.log(
                    `${restaurant.name}:`,
                    latitude,
                    longitude
                );


                // -----------------------------------------
                // CHECK COORDINATES
                // -----------------------------------------

                if (
                    isNaN(latitude) ||
                    isNaN(longitude)
                ) {

                    console.error(
                        "Invalid coordinates for:",
                        restaurant
                    );

                    return;

                }


                // -----------------------------------------
                // CREATE LEAFLET MARKER
                // -----------------------------------------

                const marker = L.marker([
                    latitude,
                    longitude
                ]);


                // -----------------------------------------
                // CREATE POPUP
                // -----------------------------------------

                marker.bindPopup(`

                    <div>

                        <h3 style="margin-top: 0;">
                            ${restaurant.name}
                        </h3>

                        <strong>Cuisine:</strong>
                        ${restaurant.cuisine}

                        <br>

                        <strong>Rating:</strong>
                        ${restaurant.rating}

                        <br>

                        <strong>Price:</strong>
                        ${restaurant.price_level}

                        <br>

                        <strong>Outdoor Seating:</strong>
                        ${
                            restaurant.outdoor_seating
                                ? "Yes"
                                : "No"
                        }

                        <br><br>

                        <strong>Coordinates:</strong>
                        <br>

                        ${latitude}, ${longitude}

                    </div>

                `);


                // -----------------------------------------
                // ADD MARKER TO GROUP
                // -----------------------------------------

                marker.addTo(markerGroup);

            });


            // ---------------------------------------------
            // ADD MARKERS TO MAP
            // ---------------------------------------------

            markerGroup.addTo(map);


            // ---------------------------------------------
            // AUTOMATICALLY ZOOM TO RESTAURANTS
            // ---------------------------------------------

            if (markerGroup.getLayers().length > 0) {

                map.fitBounds(
                    markerGroup.getBounds(),
                    {
                        padding: [50, 50],
                        maxZoom: 15
                    }
                );

            }

        })


        // =====================================================
        // HANDLE ERRORS
        // =====================================================

        .catch(error => {

            console.error(
                "Error loading restaurants:",
                error
            );

            document.getElementById("status").innerText =
                "Error loading restaurants.";

        });

    </script>

</body>
</html>
